name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name:    Windows / MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild overdub.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:TreatWarningAsError=true
          /warnAsError

  linux:
    name:    Linux / MinGW
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: make release CFLAGS_COMMON+=' -Werror'
