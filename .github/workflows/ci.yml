name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name:    Windows / MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run:  >
          msbuild overdub.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:TreatWarningAsError=true
          /warnAsError

      - name: Create the mod template
        uses: ./.github/actions/mod-template
        with:
          destination: package/mod-template

      - name:  Build the mod template
        shell: pwsh
        run: |
          msbuild package\mod-template\mod.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ModName=example `
            /p:TreatWarningAsError=true `
            /warnAsError

  linux:
    name:    Linux / MinGW
    # a settled image: ubuntu-latest moving to a new release has broken the package mirrors before
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run:  |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y gcc-mingw-w64-x86-64

      - name: Build
        run:  make release CC="x86_64-w64-mingw32-gcc -Werror"

      - name: Create the mod template
        uses: ./.github/actions/mod-template
        with:
          destination: package/mod-template

      - name: Build the mod template
        run:  make -C package/mod-template CONFIG=release MOD_NAME=example CC="x86_64-w64-mingw32-gcc -Werror"
