name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name:    Windows / MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run:  >
          msbuild overdub.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:TreatWarningAsError=true
          /warnAsError

      - name: Create the mod template
        uses: ./.github/actions/mod-template
        with:
          destination: package/mod-template

      - name:  Build the mod template
        shell: pwsh
        run: |
          msbuild package\mod-template\mod.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ModName=example `
            /p:TreatWarningAsError=true `
            /warnAsError

  mingw:
    name:    Windows / MinGW
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name:  Build
        shell: msys2 {0}
        run:   make release CC="x86_64-w64-mingw32-gcc -Werror"

      - name: Create the mod template
        uses: ./.github/actions/mod-template
        with:
          destination: package/mod-template

      - name:  Build the mod template
        shell: msys2 {0}
        run:   make -C package/mod-template CONFIG=release MOD_NAME=example CC="x86_64-w64-mingw32-gcc -Werror"
