name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name:    Build and package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild overdub.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:TreatWarningAsError=true
          /warnAsError

      - name:  Get version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not determine release version"
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name:  Download latest hibiki-bootstrap
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force bootstrap | Out-Null

          gh release download `
            --repo akmubi/hibiki-bootstrap `
            --pattern XAPOFX1_5.dll `
            --pattern dsound.dll `
            --dir bootstrap

      - name:  Create packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\steam | Out-Null
          New-Item -ItemType Directory -Force package\epic  | Out-Null
          New-Item -ItemType Directory -Force package\xbox  | Out-Null

          $templateRoot = "package\mod-template"
          $templateDirectories = @(
            "$templateRoot\build"
            "$templateRoot\docs"
            "$templateRoot\include"
            "$templateRoot\vendor\kb"
            "$templateRoot\vendor\minhook\include"
            "$templateRoot\vendor\nuklear\include"
            "$templateRoot\vendor\stb"
          )
          New-Item -ItemType Directory -Force -Path $templateDirectories | Out-Null

          Copy-Item build\overdub.dll package\steam\
          Copy-Item bootstrap\XAPOFX1_5.dll package\steam\

          Copy-Item build\overdub.dll package\epic\
          Copy-Item bootstrap\XAPOFX1_5.dll package\epic\

          Copy-Item build\overdub.dll package\xbox\
          Copy-Item bootstrap\dsound.dll package\xbox\

          Copy-Item LICENSE "$templateRoot\"
          Copy-Item build\overdub.lib "$templateRoot\build\"
          Copy-Item docs\MOD_DEVELOPMENT.md "$templateRoot\docs\"
          Copy-Item docs\mod-development "$templateRoot\docs\" -Recurse
          Copy-Item docs\lua "$templateRoot\docs\" -Recurse
          Copy-Item include\* "$templateRoot\include\" -Recurse
          Copy-Item mod\main.c "$templateRoot\"
          Copy-Item mod\Makefile "$templateRoot\"
          Copy-Item mod\mod.vcxproj "$templateRoot\"
          Copy-Item mod\mod.vcxproj.filters "$templateRoot\"
          Copy-Item mod\README.md "$templateRoot\"
          Copy-Item mod\compile_flags.txt "$templateRoot\"
          Copy-Item vendor\kb\kb_text_shape.h "$templateRoot\vendor\kb\"
          Copy-Item vendor\kb\LICENSE "$templateRoot\vendor\kb\"
          Copy-Item vendor\minhook\include\MinHook.h "$templateRoot\vendor\minhook\include\"
          Copy-Item vendor\nuklear\include\nuklear.h "$templateRoot\vendor\nuklear\include\"
          Copy-Item vendor\nuklear\LICENSE "$templateRoot\vendor\nuklear\"
          Copy-Item vendor\stb\stb_sprintf.h "$templateRoot\vendor\stb\"
          Copy-Item vendor\stb\LICENSE "$templateRoot\vendor\stb\"

          Compress-Archive `
            -Path package\steam\* `
            -DestinationPath "overdub-$env:VERSION.steam.zip"

          Compress-Archive `
            -Path package\epic\* `
            -DestinationPath "overdub-$env:VERSION.epic.zip"

          Compress-Archive `
            -Path package\xbox\* `
            -DestinationPath "overdub-$env:VERSION.xbox.zip"

          Compress-Archive `
            -Path "$templateRoot\*" `
            -DestinationPath "overdub-$env:VERSION.mod-template.zip"

      - name: Validate mod template
        shell: pwsh
        run: |
          $templateRoot = (Resolve-Path package\mod-template).Path
          $validationRoot = Join-Path (Resolve-Path package).Path "mod-template-validation"

          msbuild "$templateRoot\mod.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ModName=example `
            "/p:OutDir=$validationRoot\out\" `
            "/p:IntDir=$validationRoot\obj\" `
            /p:TreatWarningAsError=true `
            /warnAsError

      - name:  Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "overdub-$env:VERSION.steam.zip" `
            "overdub-$env:VERSION.epic.zip" `
            "overdub-$env:VERSION.xbox.zip" `
            "overdub-$env:VERSION.mod-template.zip" `
            "build\overdub.lib" `
            --clobber
