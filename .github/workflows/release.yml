name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Overdub
        uses: actions/checkout@v4

      - name: Checkout hibiki-bootstrap
        uses: actions/checkout@v4
        with:
          repository: akmubi/hibiki-bootstrap
          path: hibiki-bootstrap

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Overdub
        run: >
          msbuild overdub.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Build bootstrap DLLs
        shell: cmd
        run: |
          cd hibiki-bootstrap
          call build.bat steam overdub.dll
          call build.bat epic overdub.dll
          call build.bat xbox overdub.dll

      - name: Get version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not determine release version"
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\steam | Out-Null
          New-Item -ItemType Directory -Force package\epic  | Out-Null
          New-Item -ItemType Directory -Force package\xbox  | Out-Null

          Copy-Item build\overdub.dll package\steam\
          Copy-Item hibiki-bootstrap\build\steam\XAPOFX1_5.dll package\steam\

          Copy-Item build\overdub.dll package\epic\
          Copy-Item hibiki-bootstrap\build\epic\XAPOFX1_5.dll package\epic\

          Copy-Item build\overdub.dll package\xbox\
          Copy-Item hibiki-bootstrap\build\xbox\dsound.dll package\xbox\

          Compress-Archive `
            -Path package\steam\* `
            -DestinationPath "overdub-$env:VERSION.steam.zip"

          Compress-Archive `
            -Path package\epic\* `
            -DestinationPath "overdub-$env:VERSION.epic.zip"

          Compress-Archive `
            -Path package\xbox\* `
            -DestinationPath "overdub-$env:VERSION.xbox.zip"

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "overdub-$env:VERSION.steam.zip" `
            "overdub-$env:VERSION.epic.zip" `
            "overdub-$env:VERSION.xbox.zip" `
            --clobber
